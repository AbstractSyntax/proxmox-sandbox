name: Ansible CI/CD

"on":
  push:
    branches:
      - ci/ansible-pipeline
      - main
  workflow_dispatch:

jobs:
  lint-and-deploy:
    runs-on: [self-hosted, sandbox]

    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init (remote state)
        working-directory: terraform-configs
        run: terraform init -input=false

      - name: Verify dynamic IP from state
        working-directory: terraform-configs
        run: terraform output -raw vm_ip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible + lint + collections
        working-directory: ansible-configs
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint
          ansible-galaxy collection install -r requirements.yml

      - name: Write vault password
        working-directory: ansible-configs
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          chmod 600 .vault_pass

      - name: Ansible lint
        working-directory: ansible-configs
        run: ansible-lint

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy
        working-directory: ansible-configs
        run: ansible-playbook docker.yml
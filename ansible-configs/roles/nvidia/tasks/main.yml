---
- name: Enable contrib and non-free Debian components
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/debian.sources
    regexp: '^Components: main$'
    replace: 'Components: main contrib non-free non-free-firmware'

- name: Blacklist nouveau driver
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-nouveau.conf
    mode: "0644"
    content: |
      blacklist nouveau
      options nouveau modeset=0

- name: Download NVIDIA CUDA keyring package
  ansible.builtin.get_url:
    url: https://developer.download.nvidia.com/compute/cuda/repos/debian12/x86_64/cuda-keyring_1.1-1_all.deb
    dest: /tmp/cuda-keyring.deb
    mode: "0644"

- name: Install NVIDIA CUDA keyring
  ansible.builtin.apt:
    deb: /tmp/cuda-keyring.deb
    state: present

- name: Prefer NVIDIA CUDA repo for driver packages
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/nvidia-cuda-repository
    mode: "0644"
    content: |
      Package: *
      Pin: origin developer.download.nvidia.com
      Pin-Priority: 600

- name: Install proprietary NVIDIA driver (CUDA repo, >=580 for Webtop Pixelflux)
  ansible.builtin.apt:
    name:
      - linux-headers-amd64
      - nvidia-driver=610.57.04-1
      - nvidia-driver-cuda=610.57.04-1
    state: present
    update_cache: true
  notify: Reboot for NVIDIA driver

- name: Create keyrings directory
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"

- name: Download NVIDIA Container Toolkit GPG key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /tmp/nvidia-container-toolkit.asc
    mode: "0644"

- name: De-armor NVIDIA Container Toolkit GPG key
  ansible.builtin.command:
    cmd: gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg /tmp/nvidia-container-toolkit.asc
    creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg

- name: Add NVIDIA Container Toolkit repository
  ansible.builtin.deb822_repository:
    name: nvidia-container-toolkit
    types: [deb]
    uris: https://nvidia.github.io/libnvidia-container/stable/deb/amd64
    suites: [/]
    signed_by: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    state: present

- name: Install NVIDIA Container Toolkit
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: true

- name: Check Docker runtimes for NVIDIA
  ansible.builtin.command:
    cmd: docker info --format '{% raw %}{{json .Runtimes}}{% endraw %}'
  register: nvidia_docker_runtimes
  changed_when: false
  failed_when: false

- name: Configure NVIDIA Docker runtime
  ansible.builtin.command:
    cmd: nvidia-ctk runtime configure --runtime=docker
  register: nvidia_ctk_configure
  when: nvidia_docker_runtimes.rc != 0 or ('nvidia' not in nvidia_docker_runtimes.stdout)
  changed_when: nvidia_ctk_configure.rc == 0
  notify: Restart Docker for NVIDIA runtime

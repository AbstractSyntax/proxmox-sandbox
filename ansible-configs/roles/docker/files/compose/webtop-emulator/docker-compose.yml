services:
  browser-emulator-desktop:
    build: .
    image: webtop-emulators:local
    container_name: browser-emulator-desktop
    restart: unless-stopped
    shm_size: "2gb"
    security_opt:
      - seccomp=unconfined
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      DRINODE: /dev/dri/renderD128
      DRI_NODE: /dev/dri/renderD128
      PIXELFLUX_WAYLAND: "true"
      KWIN_COMPOSE: QPainter
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
      SUBFOLDER: "/"
      TITLE: Cloud Emulator Console
      XDG_DATA_DIRS: /usr/local/share:/usr/share
    ports:
      - "3022:3000"
      - "3023:3001"
      - "50000-50010:50000-50010/udp"
    volumes:
      - ./config:/config:rw
      - /mnt/emulation/ps2/bios:/mnt/bios:ro
      - /mnt/emulation/ps2:/mnt/games:ro
    devices:
      - /dev/dri:/dev/dri
    gpus:
      - driver: nvidia
        count: all
        capabilities: [gpu, video, compute, utility, graphics]
    cap_add:
      - SYS_ADMIN
      - SYS_NICE
